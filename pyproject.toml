[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zephirum"
version = "2.5.8"
description = "ZEPHIRUM: quantum programming language and runtime for auditable decisions, with the ZYQL trivalent core (1/0/REFUSED)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26,<3", "lark>=1.1,<2", "qiskit>=2.6,<3"]
authors = [{name = "Reginaldo Pinezi Uhlmann", email = "builderquantunxia@gmail.com"}]
maintainers = [
  {name = "Reginaldo Pinezi Uhlmann"},
  {name = "Leonardo Henrique Gonçalves"},
  {name = "Maria Clara dos Anjos"},
]

[project.optional-dependencies]
# execucao em hardware real e simulacao ruidosa (Qiskit Runtime / Aer)
hardware = ["qiskit-aer>=0.17,<0.19", "qiskit-ibm-runtime>=0.50,<0.53"]
# paridade de semantica com o ecossistema Google
interop = ["cirq>=1.4"]
# API REST (servidor HTTP)
api = ["fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.30"]
# assinatura e KEM pos-quanticos (ML-KEM/ML-DSA)
pq = ["pqcrypto>=0.3"]
# verificacao de ida e volta OpenQASM 3 (usada apenas pelos testes)
test = ["qiskit-qasm3-import>=0.5", "fastapi>=0.110", "httpx>=0.27"]
# site de documentacao (Sphinx + tema oficial do ecossistema)
docs = ["sphinx>=7,<9", "myst-parser>=3", "qiskit-sphinx-theme>=2.1", "sphinx-copybutton>=0.5"]

[tool.setuptools.package-data]
qroute = ["maps/*.json"]

[project.scripts]
zqgate = "zqgate.cli:main"
qroute = "qroute.cli:main"
zyql-decide = "zyql_runtime:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["zqgate", "qroute", "zephirum", "zephirum.adapters"]
py-modules = ["battery_ci", "zqea_canon", "oq3", "quantum_types", "quantum_safe_readiness", "shot_auditor", "zkernel", "zqea_kem", "zqea_sig", "zquantum", "zyql_auditkit", "zyql_cirq", "zyql_lisp", "zyql_llm_compress", "zyql_mps", "zyql_protocols", "zyql_quantum_gate", "zyql_rag_layer", "zyql_robust", "zyql_runtime", "zyql_oracle_id", "zyql_selfverified", "zyql_witness", "zyql_world3", "zyql_worldscale", "zyql_zne", "zyqml_core", "zyclotron"]
