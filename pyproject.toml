[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zephirum"
version = "1.7.2"
description = "ZEPHIRUM: Lisp-style quantum programming language with the ZYQL trivalent decision core (1/0/REFUSED)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy", "lark"]
authors = [{name = "Reginaldo Gonçalves", email = "builderquantunxia@gmail.com"}]

[project.scripts]
zqgate = "zqgate.cli:main"

[tool.setuptools]
packages = ["zqgate"]
