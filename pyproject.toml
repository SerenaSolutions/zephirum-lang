[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zephirum"
version = "2.1.1"
description = "ZEPHIRUM: Lisp-style quantum programming language with the ZYQL trivalent decision core (1/0/REFUSED)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy", "lark", "qiskit>=2.6"]
authors = [{name = "Reginaldo Gonçalves", email = "builderquantunxia@gmail.com"}]

[project.optional-dependencies]
# execucao em hardware real e simulacao ruidosa (Qiskit Runtime / Aer)
hardware = ["qiskit-aer>=0.17", "qiskit-ibm-runtime>=0.50"]
# paridade de semantica com o ecossistema Google
interop = ["cirq>=1.4"]
# verificacao de ida e volta OpenQASM 3 (usada apenas pelos testes)
test = ["qiskit-qasm3-import>=0.5"]

[project.scripts]
zqgate = "zqgate.cli:main"
zyql-decide = "zyql_runtime:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["zqgate"]
py-modules = ["battery_ci", "oq3", "quantum_types", "shot_auditor", "zkernel", "zqea_kem", "zqea_sig", "zquantum", "zyql_auditkit", "zyql_cirq", "zyql_lisp", "zyql_llm_compress", "zyql_mps", "zyql_protocols", "zyql_quantum_gate", "zyql_rag_layer", "zyql_robust", "zyql_runtime", "zyql_selfverified", "zyql_witness", "zyql_world3", "zyql_worldscale", "zyql_zne", "zyqml_core"]
