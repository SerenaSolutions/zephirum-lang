[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zq-gate"
version = "1.5.0"
description = "ZQ-GATE: verified quantum decision gate — trivalent verdicts (1/0/REFUSED) with SHA3-256 receipts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy", "lark"]
authors = [{name = "Reginaldo Gonçalves", email = "builderquantunxia@gmail.com"}]

[project.scripts]
zqgate = "zqgate.cli:main"

[tool.setuptools]
packages = ["zqgate"]
