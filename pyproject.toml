[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zephirum"
version = "2.1.0"
description = "ZEPHIRUM: Lisp-style quantum programming language with the ZYQL trivalent decision core (1/0/REFUSED)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy", "lark", "qiskit>=2.6"]
authors = [{name = "Reginaldo Gonçalves", email = "builderquantunxia@gmail.com"}]

[project.optional-dependencies]
# execucao em hardware real e simulacao ruidosa (Qiskit Runtime / Aer)
hardware = ["qiskit-aer>=0.17", "qiskit-ibm-runtime>=0.50"]
# paridade de semantica com o ecossistema Google
interop = ["cirq>=1.4"]

[project.scripts]
zqgate = "zqgate.cli:main"
zyql-decide = "zyql_runtime:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["zqgate"]
py-modules = ["zquantum", "zkernel", "quantum_types", "zyql_lisp", "zyql_quantum_gate", "zyql_rag_layer", "battery_ci", "oq3", "zyql_runtime", "zyqml_core", "zyql_zne", "zyql_mps"]
