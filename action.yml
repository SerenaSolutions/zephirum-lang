name: 'ZYQL Decision Gate'
description: 'Block or pass a workflow on an auditable decision: verdict 1, 0, REFUSED or INCONCLUSIVE, sealed in a SHA3-256 receipt.'
branding:
  icon: 'shield'
  color: 'blue'
inputs:
  shots:
    description: 'Number of samples in the evidence payload.'
    required: true
  counts:
    description: 'JSON object with observed counts, e.g. {"000": 964}.'
    required: true
  threshold:
    description: 'Proportion the evidence must beat, between 0 and 1.'
    required: true
  delta:
    description: 'Maximum tolerated error probability (Hoeffding bound).'
    required: false
    default: '0.05'
  fail_on:
    description: 'Verdicts that fail the job, comma separated. Default fails on 0 and REFUSED.'
    required: false
    default: '0,REFUSED'
outputs:
  verdict:
    description: 'The decision: 1, 0, REFUSED or INCONCLUSIVE.'
    value: ${{ steps.decidir.outputs.verdict }}
  receipt:
    description: 'Path to the receipt written for this decision.'
    value: ${{ steps.decidir.outputs.receipt }}
runs:
  using: 'composite'
  steps:
    - id: decidir
      shell: bash
      run: |
        python3 "${{ github.action_path }}/tools/action_decidir.py" \
          --shots "${{ inputs.shots }}" \
          --counts '${{ inputs.counts }}' \
          --threshold "${{ inputs.threshold }}" \
          --delta "${{ inputs.delta }}" \
          --receipt "$RUNNER_TEMP/zyql_receipt.json"
        VEREDITO=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/zyql_receipt.json'))['verdict'])")
        echo "verdict=$VEREDITO" >> "$GITHUB_OUTPUT"
        echo "receipt=$RUNNER_TEMP/zyql_receipt.json" >> "$GITHUB_OUTPUT"
        case ",${{ inputs.fail_on }}," in
          *",$VEREDITO,"*) echo "::error::veredito $VEREDITO reprova o portao"; exit 1 ;;
        esac
