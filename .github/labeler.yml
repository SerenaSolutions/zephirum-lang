"area:core":
  - changed-files:
      - any-glob-to-any-file: ["src/**"]
"area:api":
  - changed-files:
      - any-glob-to-any-file: ["api/**"]
"area:tests":
  - changed-files:
      - any-glob-to-any-file: ["tests/**"]
"area:deploy":
  - changed-files:
      - any-glob-to-any-file: ["site/**", "vercel.json", ".vercelignore", ".github/workflows/vercel-cicd.yml"]
"area:docs":
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "*.md"]
