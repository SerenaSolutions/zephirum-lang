name: labeler

# Rotula PR pelo caminho alterado, para o historico ficar legivel.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
