name: CI
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install numpy lark scipy pqcrypto cryptography qiskit qiskit-aer cirq
      - run: python tests/test_canonical.py
        env:
          PYTHONHASHSEED: "0"
      - run: python tests/test_zqea_verify.py
      - run: python tests/test_lisp_regression.py
      - run: python tests/test_meta.py
      - run: python tests/test_runtime.py
      - run: python tests/test_kem.py
        env:
          PYTHONPATH: src
      - run: python tests/test_selfverified.py
      - run: python tests/test_witness.py
      - run: python tests/test_protocols.py
      - run: python tests/test_cirq.py
      - run: PYTHONPATH=src:tools python tests/test_auditkit.py
      - run: PYTHONPATH=src:tools python tests/test_regression_seal.py
      - run: python tests/test_worldscale.py
      - run: python tests/test_world3.py
