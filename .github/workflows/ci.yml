name: CI
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install numpy lark scipy
      - run: python tests/test_canonical.py
        env:
          PYTHONHASHSEED: "0"
      - run: python tests/test_zqea_verify.py
      - run: python tests/test_lisp_regression.py
      - run: python tests/test_meta.py
