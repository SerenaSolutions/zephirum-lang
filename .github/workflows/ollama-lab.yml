name: ollama-lab

# IA local no runner: sem chave de API, sem custo por token.
#
# Por que um workflow e nao as 37 entradas da busca: apenas 7 repositorios sao
# actions de Ollama de fato (2 arquivados); o resto dos resultados sao actions de
# terceiros que so mencionam a ferramenta na descricao. Instalar varias nao soma
# capacidade, sobe o mesmo servidor e disputa a mesma porta.

on:
  workflow_dispatch:
    inputs:
      modelo:
        description: 'Modelo do catalogo Ollama'
        required: false
        default: 'qwen2.5-coder:1.5b'
      tarefa:
        description: 'O que o modelo local deve fazer com o contexto'
        required: false
        default: 'Resuma em 5 linhas o que mudou e aponte um risco tecnico.'

permissions:
  contents: read

jobs:
  local:
    name: inferencia local (custo zero de API)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: instalar ollama
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh -o /tmp/ollama.sh
          sh /tmp/ollama.sh
          ollama --version

      - name: subir servidor
        run: |
          set -euo pipefail
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:11434/api/tags > /dev/null; then
              echo "servidor no ar apos $((i*2))s"
              exit 0
            fi
            sleep 2
          done
          echo "servidor nao subiu"
          tail -20 /tmp/ollama.log
          exit 1

      - name: baixar modelo
        run: |
          set -uo pipefail
          for m in "${{ inputs.modelo }}" "llama3.2:1b" "qwen2.5:0.5b" "tinyllama"; do
            echo "tentando $m"
            if ollama pull "$m" 2>/dev/null; then
              echo "MODELO=$m" >> "$GITHUB_ENV"
              echo "modelo pronto: $m"
              break
            fi
          done
          if [ -z "${MODELO:-}" ]; then
            echo "nenhum modelo disponivel"
            exit 1
          fi

      - name: preparar contexto
        run: |
          set -euo pipefail
          git log -5 --pretty='%h %s' > /tmp/contexto.txt
          git diff HEAD~1 --stat 2>/dev/null | tail -15 >> /tmp/contexto.txt || true
          printf '%s\n\nCONTEXTO:\n%s\n' "${{ inputs.tarefa }}" "$(cat /tmp/contexto.txt)" > /tmp/prompt.txt
          wc -c /tmp/prompt.txt

      - name: inferencia local
        run: |
          set -euo pipefail
          python3 tools/ollama_local.py
          echo "--- resposta do modelo local ---"
          cat /tmp/resposta.txt

      - name: publicar no resumo
        run: |
          {
            echo "## Inferencia local (Ollama)"
            echo
            echo "**Modelo:** ${MODELO}"
            echo "**Custo de API:** zero"
            echo
            echo "### Resposta"
            echo '```'
            cat /tmp/resposta.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ollama-recibo
          path: |
            /tmp/recibo_ollama.json
            /tmp/resposta.txt
