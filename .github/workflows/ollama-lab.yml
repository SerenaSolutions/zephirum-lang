name: ollama-lab

# IA local no runner: custo zero de API.
#
# Refinado para usar as actions de Ollama que existem de fato. A busca do
# Marketplace devolve 37 resultados, mas so 5 repositorios ativos e nao
# arquivados sobram, e destes apenas 2 sao actions de verdade:
#   ai-action/setup-ollama  v2.1.18  (instala e sobe o servidor)
#   ai-action/ollama-action v2.0.1   (executa o prompt)
# Os outros tres sao catalogo, demo e app de exemplo: nao entram em YAML.
# Ambos fixados por SHA de commit, nao por tag movel.
on:
  workflow_dispatch:
    inputs:
      modelo:
        description: 'Modelo pequeno para CPU do runner'
        required: false
        default: 'qwen2.5-coder:1.5b'
      tarefa:
        description: 'O que o modelo local deve fazer'
        required: false
        default: 'Resuma o diff recente em 3 linhas e aponte um risco.'

permissions:
  contents: read

jobs:
  inferencia-local:
    name: inferencia local (custo zero de API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODELO: ${{ inputs.modelo }}
    steps:
      - uses: actions/checkout@v4

      - name: instalar e subir ollama
        uses: ai-action/setup-ollama@798483f55e7466b967eee0627554aa3d0e0f3279
        with:
          model: ${{ inputs.modelo }}

      - name: montar prompt
        id: p
        run: |
          {
            echo "Tarefa: ${{ inputs.tarefa }}"
            echo
            echo "Contexto (ultimos commits):"
            git log -3 --pretty='- %h %s'
          } > prompt.txt
          {
            echo "PROMPT<<FIM_PROMPT"
            cat prompt.txt
            echo "FIM_PROMPT"
          } >> "$GITHUB_OUTPUT"
          wc -c prompt.txt

      - name: rodar modelo local
        id: gen
        uses: ai-action/ollama-action@0b0ba51b122d9259d4f0a0118932f6bb719c1006
        with:
          model: ${{ inputs.modelo }}
          prompt: ${{ steps.p.outputs.PROMPT }}
          response: resposta.txt

      - name: garantir arquivo de resposta
        run: |
          if [ ! -s resposta.txt ]; then
            printf '%s\n' "${{ steps.gen.outputs.response }}" > resposta.txt
          fi
          echo "--- resposta ---"
          cat resposta.txt

      - name: selar em SHA3-256
        run: python3 tools/seal_text.py prompt.txt resposta.txt recibo_ollama.json

      - name: publicar no resumo
        run: |
          {
            echo "### Ollama local — $MODELO"
            echo
            echo "Custo de API: 0"
            echo
            echo '```'
            cat resposta.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ollama-local
          path: |
            prompt.txt
            resposta.txt
            recibo_ollama.json
