name: Quantum Regression Seal
on: [push, pull_request]
jobs:
  qrs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -q numpy qiskit
      - run: PYTHONPATH=src:tools python tests/test_regression_seal.py
      - run: PYTHONPATH=src:tools python tools/regression_seal.py
