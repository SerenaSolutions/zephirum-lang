name: conformance

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  conformidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy lark
      - name: Suíte de conformidade ZYQL
        run: python conformance/run_conformance.py
      - name: Relatório para agente externo (JSON)
        if: always()
        run: python conformance/run_conformance.py --json > conformance_report.json || true
      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: conformance_report.json
