name: docker-infra

on:
  push:
    paths:
      - "docker/**"
      - "src/**"
      - "api/**"
      - "pyproject.toml"
      - ".github/workflows/docker-infra.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build infrastructure image
        run: docker build -f docker/Dockerfile.infra -t zephyrum-infra:ci .

      - name: Smoke test inside the image
        run: docker run --rm zephyrum-infra:ci test

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/infra
          docker tag zephyrum-infra:ci "$IMAGE:latest"
          docker tag zephyrum-infra:ci "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"
