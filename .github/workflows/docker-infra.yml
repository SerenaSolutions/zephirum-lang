name: docker-infra

on:
  push:
    paths:
      - "docker/**"
      - "src/**"
      - "api/**"
      - "pyproject.toml"
      - ".github/workflows/docker-infra.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "build | witness (witness roda o teste na QPU IBM dentro do container)"
        required: false
        default: "build"

permissions:
  contents: read
  packages: write

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build infrastructure image
        run: docker build -f docker/Dockerfile.infra -t zephyrum-infra:ci .

      - name: Smoke test inside the image
        run: docker run --rm zephyrum-infra:ci test

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/infra"
          docker tag zephyrum-infra:ci "$IMAGE:latest"
          docker tag zephyrum-infra:ci "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"

  witness:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'witness'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build infrastructure image
        run: docker build -f docker/Dockerfile.infra -t zephyrum-infra:ci .

      - name: QPU witness inside the container
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
          IBM_QUANTUM_CRN: ${{ secrets.IBM_QUANTUM_CRN }}
        run: |
          mkdir -p results
          docker run --rm             -e IBM_QUANTUM_TOKEN -e IBM_QUANTUM_CRN             -e RECEIPT_PATH=/zephyrum/os/results/witness.json             -v "$PWD/results:/zephyrum/os/results"             zephyrum-infra:ci witness

      - uses: actions/upload-artifact@v4
        with:
          name: qpu-witness-receipt
          path: results/
