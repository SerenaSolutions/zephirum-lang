name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '30 3 * * 1'
  push:
    branches: [main]

permissions: read-all

jobs:
  analise:
    name: Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # SARIF
      id-token: write          # assinatura dos resultados
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: resultados.sarif
          results_format: sarif
          publish_results: true   # alimenta o badge publico do OpenSSF
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard-sarif
          path: resultados.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: resultados.sarif
