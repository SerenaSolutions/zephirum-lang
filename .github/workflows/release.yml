name: Release (reproducible build + sigstore)

# Audit item 7 (docs/AUDIT_RESPONSE_2026-10-19.md): reproducible, signed releases.
# Runs only when a version tag is pushed. Keyless signing via GitHub OIDC (sigstore):
# no private key is stored anywhere in this repository.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # attach assets to the release
  id-token: write      # sigstore keyless signing (OIDC)
  attestations: write  # build provenance attestation

jobs:
  build-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build source distribution (deterministic)
        env:
          SOURCE_DATE_EPOCH: "1767225600"   # fixed timestamp => byte-reproducible archive
          PYTHONHASHSEED: "0"
        run: |
          mkdir -p dist
          git archive --format=tar --prefix="zephirum-${GITHUB_REF_NAME}/" "${GITHUB_REF_NAME}" \
            | gzip -n > "dist/zephirum-${GITHUB_REF_NAME}.tar.gz"
          sha256sum dist/*.tar.gz | tee dist/SHA256SUMS

      - name: Run canonical battery before signing
        env:
          PYTHONHASHSEED: "0"
        run: python tests/test_canonical.py

      - name: Build provenance attestation (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts with cosign (keyless)
        run: |
          for f in dist/*.tar.gz dist/SHA256SUMS; do
            cosign sign-blob --yes "$f" --bundle "$f.sigstore.json"
          done

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/*.sigstore.json
