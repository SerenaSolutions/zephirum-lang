name: Gate de linguagem (promptfoo, sem chave de API)

on:
  workflow_dispatch:
  push:
    paths:
      - "lab/eval/**"
      - ".github/workflows/promptfoo-gate.yml"

jobs:
  gate:
    name: avaliacao da camada de linguagem
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: promptfoo (MIT, gratuito)
        run: npm install -g promptfoo
      - name: casos de borda do ZYQL
        run: promptfoo eval -c lab/eval/promptfooconfig.yaml --no-cache --max-concurrency 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-promptfoo
          path: lab/eval/output.json
