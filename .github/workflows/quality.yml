name: quality

# Qualidade estatica do codigo Python. Nao existia nenhuma checagem de lint
# ou de tipos no repositorio antes deste workflow.
# Portao: apenas erros reais (sintaxe, nome indefinido, import quebrado).
# Informativo: lint completo e mypy, que hoje somam centenas de avisos.

on:
  push:
    branches: [main]
    paths: ["src/**", "api/**", "tools/**", "tests/**", "pyproject.toml", ".github/workflows/quality.yml"]
  pull_request:
    branches: [main]
    paths: ["src/**", "api/**", "tools/**", "tests/**", "pyproject.toml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: portao - erros reais
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check --select E9,F63,F7,F82 --output-format=concise
          src: "src api tools tests"
      - name: informativo - lint completo
        continue-on-error: true
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check --statistics --output-format=concise
          src: "src api tools tests"

  sintaxe:
    name: sintaxe python 3.10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: compilar tudo
        run: python -m compileall -q src api tools tests

  tipos:
    name: mypy (informativo)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: jpetrucciani/mypy-check@1.20.2
        # continue-on-error na ETAPA, nao so no job: no nivel do job o check-run
        # continua vermelho e trava o PR, mesmo com a run verde.
        continue-on-error: true
        with:
          path: "src"
          python_version: "3.10"
          mypy_flags: "--ignore-missing-imports --no-strict-optional"
