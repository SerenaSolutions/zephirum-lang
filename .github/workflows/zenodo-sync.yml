name: ZENODO_SYNC
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to archive (e.g. v2.1.0)"
        required: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync release to Zenodo concept DOI
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NOTAS vem por env, nunca interpolada no shell: o corpo da release tem
          # crase e $(...), que o bash executaria como comando.
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            NOTES="$RELEASE_NOTES"
          else
            TAG="${{ github.event.inputs.tag }}"
            NOTES=""
          fi
          python3 .github/scripts/zenodo_sync.py "$TAG" "$NOTES"
