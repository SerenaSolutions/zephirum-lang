name: coverage
on:
  push:
    branches: [main]
  pull_request:
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy lark scipy qiskit pytest pytest-cov pqcrypto cryptography
      - name: cobertura do núcleo
        run: python -m pytest tests/ -q --cov=src --cov-report=term-missing --cov-fail-under=0 || true
      - name: piso de cobertura (não regride)
        run: python -m pytest tests/test_runtime.py -q --cov=zyql_runtime --cov-fail-under=70
        env:
          PYTHONPATH: src
