name: Deploy docs site to Pages

on:
  push:
    branches: [main]
    paths: ['docs/**', 'site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    name: Construir o site (Sphinx + tema do ecossistema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Sphinx e o tema
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -e ".[docs]"
      - name: Construir HTML
        run: sphinx-build -b html docs _build/html
      - name: Guardar o resultado
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  publicar:
    name: Publicar no Pages
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
